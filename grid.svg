      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.5"/>
    </pattern>
    <pattern id="smallgrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#smallgrid)" />
  <circle cx="50" cy="50" r="1" fill="rgba(112, 157, 255, 0.5)" />
  <circle cx="10" cy="10" r="1" fill="rgba(112, 157, 255, 0.5)" />
  <circle cx="90" cy="90" r="1" fill="rgba(112, 157, 255, 0.5)" />
  <circle cx="90" cy="10" r="1" fill="rgba(112, 157, 255, 0.5)" />
  <circle cx="10" cy="90" r="1" fill="rgba(112, 157, 255, 0.5)" />
</svg>
